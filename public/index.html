<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Solara AI — A minimal AI coding assistant for HTML, CSS, JavaScript, Node.js, and more." />
  <title>Solara AI</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <div class="logo-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="16 18 22 12 16 6"/>
              <polyline points="8 6 2 12 8 18"/>
            </svg>
          </div>
          <span class="logo-text">Solara</span>
        </div>
        <button class="icon-btn sidebar-close" id="sidebarClose" aria-label="Close sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <button class="new-chat-btn" id="newChatBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        <span>New chat</span>
      </button>

      <div class="sidebar-section">
        <div class="section-title">Recent</div>
        <div class="chat-list" id="chatList"></div>
      </div>

      <div class="sidebar-footer">
        <div class="model-selector-wrapper">
          <label class="section-title" for="presetSelect">Mode</label>
          <div class="select-wrapper">
            <select id="presetSelect" class="model-select">
              <option value="general">General</option>
              <option value="react">React Expert</option>
              <option value="debugger">Debugger</option>
              <option value="explainer">Explainer</option>
              <option value="reviewer">Code Reviewer</option>
            </select>
            <svg class="select-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
        </div>
        <div class="model-selector-wrapper">
          <label class="section-title" for="modelSelect">Model</label>
          <div class="select-wrapper">
            <select id="modelSelect" class="model-select">
              <option value="deepseek">DeepSeek V3</option>
              <option value="gemini">Gemini 2.0 Flash</option>
            </select>
            <svg class="select-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
        </div>
        <div class="footer-info">
          <span>Solara</span>
          <span class="dot">·</span>
          <span>v1.0</span>
        </div>
      </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="main">
      <!-- Top Bar -->
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
        <div class="topbar-title">
          <span class="model-badge" id="presetBadge">General</span>
          <span class="model-badge" id="modelBadge">DeepSeek V3</span>
        </div>
        <button class="icon-btn" id="exportBtn" aria-label="Export chat" title="Export chat as Markdown">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
        </button>
        <button class="icon-btn" id="clearBtn" aria-label="Clear chat" title="Clear chat">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>
        </button>
      </header>

      <!-- Chat Messages -->
      <div class="chat-container" id="chatContainer">
        <div class="welcome-screen" id="welcomeScreen">
          <div class="welcome-logo" aria-hidden="true">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="16 18 22 12 16 6"/>
              <polyline points="8 6 2 12 8 18"/>
            </svg>
          </div>
          <h1 class="welcome-title">Solara</h1>
          <p class="welcome-subtitle">A minimal AI coding assistant for the web.</p>

          <div class="suggestion-grid">
            <button class="suggestion-card" data-prompt="Build a modern landing page with HTML, CSS, and JavaScript that includes a hero section, features, and a contact form.">
              <div class="suggestion-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="18" height="18" rx="2"/>
                  <path d="M3 9h18M9 21V9"/>
                </svg>
              </div>
              <div class="suggestion-title">Landing page</div>
              <div class="suggestion-desc">Modern responsive layout</div>
            </button>
            <button class="suggestion-card" data-prompt="Build a todo list app using vanilla JavaScript with local storage persistence.">
              <div class="suggestion-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="9 11 12 14 22 4"/>
                  <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
                </svg>
              </div>
              <div class="suggestion-title">Todo app</div>
              <div class="suggestion-desc">Vanilla JS with storage</div>
            </button>
            <button class="suggestion-card" data-prompt="Explain how JavaScript async and await work, with practical examples.">
              <div class="suggestion-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/>
                  <path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/>
                </svg>
              </div>
              <div class="suggestion-title">Learn async/await</div>
              <div class="suggestion-desc">JavaScript concepts</div>
            </button>
            <button class="suggestion-card" data-prompt="Debug this code and explain what is wrong: function sum(a, b) { return a - b }">
              <div class="suggestion-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M8 2l1.5 1.5M16 2l-1.5 1.5"/>
                  <path d="M12 20v-8"/>
                  <path d="M6 8a6 6 0 0112 0v4a6 6 0 01-12 0z"/>
                  <path d="M4 14h2M18 14h2M4 10h2M18 10h2"/>
                </svg>
              </div>
              <div class="suggestion-title">Debug code</div>
              <div class="suggestion-desc">Find and fix bugs</div>
            </button>
          </div>
        </div>

        <div class="messages" id="messages"></div>
      </div>

      <!-- Input Area -->
      <div class="input-area">
        <form class="input-form" id="chatForm">
          <div class="input-wrapper">
            <textarea
              id="userInput"
              class="user-input"
              placeholder="Ask a coding question..."
              rows="1"
              autocomplete="off"
            ></textarea>
            <button type="submit" class="send-btn" id="sendBtn" aria-label="Send message">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"/>
                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
              </svg>
            </button>
          </div>
          <div class="input-hint">
            <kbd>Enter</kbd> to send · <kbd>Shift</kbd> + <kbd>Enter</kbd> for new line
          </div>
        </form>
      </div>
    </main>

    <!-- Sidebar Overlay (Mobile) -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
  </div>

  <!-- Libraries: Markdown + Syntax Highlighting -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
