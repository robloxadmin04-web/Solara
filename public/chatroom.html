<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Solara Chat Room</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0a0a;
    --bg2: #111;
    --bg3: #1a1a1a;
    --border: #262626;
    --text: #f5f5f5;
    --muted: #a3a3a3;
    --accent: #fff;
    --accent-fg: #0a0a0a;
    --mine: #3b82f6;
    --other: #262626;
  }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }
  button, input { font-family: inherit; }

  /* ===== NAME PROMPT ===== */
  .name-screen {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: var(--bg);
  }
  .name-card {
    width: 100%;
    max-width: 360px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px 24px;
    text-align: center;
  }
  .name-title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 6px;
    letter-spacing: -0.02em;
  }
  .name-subtitle {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 20px;
  }
  .name-input {
    width: 100%;
    padding: 12px 14px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    margin-bottom: 10px;
  }
  .name-input:focus { border-color: #555; }
  .name-btn {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: var(--accent-fg);
    border: none;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  .name-btn:disabled { opacity: 0.5; }
  .name-error {
    color: #f87171;
    font-size: 12px;
    margin-top: 10px;
    min-height: 16px;
  }

  /* ===== CHAT ROOM ===== */
  .room {
    display: none;
    height: 100vh;
    height: 100dvh;
    flex-direction: column;
  }
  .room.active { display: flex; }

  .header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg2);
    flex-shrink: 0;
  }
  .header-title {
    font-size: 16px;
    font-weight: 600;
  }
  .header-info {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }
  .leave-btn {
    padding: 6px 12px;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
  }
  .leave-btn:active { background: var(--bg3); }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 0;
  }
  .msg {
    display: flex;
    flex-direction: column;
    max-width: 80%;
  }
  .msg.mine { align-self: flex-end; align-items: flex-end; }
  .msg.other { align-self: flex-start; align-items: flex-start; }
  .msg.system { align-self: center; align-items: center; max-width: 90%; }

  .msg-name {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 3px;
    padding: 0 4px;
    font-weight: 600;
  }
  .msg-bubble {
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.4;
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .msg.mine .msg-bubble {
    background: var(--mine);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .msg.other .msg-bubble {
    background: var(--other);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .msg.system .msg-bubble {
    background: transparent;
    color: var(--muted);
    font-size: 11px;
    font-style: italic;
    padding: 4px 12px;
  }
  .msg-time {
    font-size: 10px;
    color: #666;
    margin-top: 3px;
    padding: 0 4px;
  }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 40px 20px;
    font-size: 13px;
  }

  .input-area {
    padding: 12px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    background: var(--bg2);
    flex-shrink: 0;
  }
  .chat-input {
    flex: 1;
    padding: 10px 14px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    resize: none;
    max-height: 100px;
    min-height: 40px;
    line-height: 1.3;
  }
  .chat-input:focus { border-color: #555; }
  .send-btn {
    width: 40px;
    height: 40px;
    background: var(--accent);
    color: var(--accent-fg);
    border: none;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .send-btn:disabled { opacity: 0.4; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
</style>
</head>
<body>

<!-- ===== NAME PROMPT ===== -->
<div class="name-screen" id="nameScreen">
  <div class="name-card">
    <div class="name-title">Solara Chat</div>
    <div class="name-subtitle">Enter your name to join the chat room</div>
    <form id="nameForm">
      <input
        type="text"
        id="nameInput"
        class="name-input"
        placeholder="Your name"
        maxlength="30"
        autocomplete="off"
        required
      />
      <button type="submit" class="name-btn" id="joinBtn">Join Chat</button>
      <div class="name-error" id="nameError"></div>
    </form>
  </div>
</div>

<!-- ===== CHAT ROOM ===== -->
<div class="room" id="room">
  <div class="header">
    <div>
      <div class="header-title">Solara Chat</div>
      <div class="header-info" id="userInfo">You are: —</div>
    </div>
    <button class="leave-btn" id="leaveBtn">Leave</button>
  </div>

  <div class="messages" id="messages">
    <div class="empty">Loading messages...</div>
  </div>

  <form class="input-area" id="chatForm">
    <textarea
      id="chatInput"
      class="chat-input"
      placeholder="Type a message..."
      rows="1"
      autocomplete="off"
    ></textarea>
    <button type="submit" class="send-btn" id="sendBtn" aria-label="Send">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </form>
</div>

<script>
// ===== CONFIG - PALITAN MO ITO NG SUPABASE MO =====
const SUPABASE_URL = 'https://YOUR-PROJECT.supabase.co';
const SUPABASE_ANON_KEY = 'YOUR-ANON-KEY-HERE';
const ROOM_TABLE = 'room_messages';  // bagong table na gagawin natin
// ==================================================

const state = {
  userId: localStorage.getItem('chat_user_id') || null,
  userName: localStorage.getItem('chat_user_name') || null,
  messages: [],
  lastMessageId: 0,
  pollTimer: null,
};

const els = {
  nameScreen: document.getElementById('nameScreen'),
  nameForm: document.getElementById('nameForm'),
  nameInput: document.getElementById('nameInput'),
  joinBtn: document.getElementById('joinBtn'),
  nameError: document.getElementById('nameError'),
  room: document.getElementById('room'),
  userInfo: document.getElementById('userInfo'),
  leaveBtn: document.getElementById('leaveBtn'),
  messages: document.getElementById('messages'),
  chatForm: document.getElementById('chatForm'),
  chatInput: document.getElementById('chatInput'),
  sendBtn: document.getElementById('sendBtn'),
};

// ===== SUPABASE HELPER =====
async function sb(path, options = {}) {
  const url = SUPABASE_URL + '/rest/v1/' + path;
  const response = await fetch(url, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
      'Prefer': options.method === 'POST' ? 'return=representation' : '',
      ...(options.headers || {}),
    },
  });
  if (!response.ok) {
    const text = await response.text();
    throw new Error('Supabase ' + response.status + ': ' + text.slice(0, 200));
  }
  const text = await response.text();
  return text ? JSON.parse(text) : null;
}

// ===== INIT =====
function init() {
  els.nameForm.addEventListener('submit', handleJoin);
  els.leaveBtn.addEventListener('click', handleLeave);
  els.chatForm.addEventListener('submit', handleSend);
  els.chatInput.addEventListener('input', autoResize);
  els.chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      els.chatForm.dispatchEvent(new Event('submit'));
    }
  });

  if (state.userId && state.userName) {
    showRoom();
  } else {
    showNamePrompt();
  }
}

function showNamePrompt() {
  els.nameScreen.style.display = 'flex';
  els.room.classList.remove('active');
  setTimeout(() => els.nameInput.focus(), 100);
}

function showRoom() {
  els.nameScreen.style.display = 'none';
  els.room.classList.add('active');
  els.userInfo.textContent = 'You are: ' + state.userName;
  loadMessages();
  startPolling();
  setTimeout(() => els.chatInput.focus(), 100);
}

async function handleJoin(e) {
  e.preventDefault();
  const name = els.nameInput.value.trim();
  if (!name || name.length < 2) {
    els.nameError.textContent = 'Name must be at least 2 characters';
    return;
  }

  els.joinBtn.disabled = true;
  els.nameError.textContent = '';

  state.userId = 'user_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  state.userName = name;
  localStorage.setItem('chat_user_id', state.userId);
  localStorage.setItem('chat_user_name', state.userName);

  try {
    // Send a system "joined" message
    await sb(ROOM_TABLE, {
      method: 'POST',
      body: JSON.stringify({
        user_id: 'system',
        user_name: 'System',
        content: name + ' joined the chat',
        is_system: true,
      }),
    });
    showRoom();
  } catch (err) {
    els.nameError.textContent = err.message;
    els.joinBtn.disabled = false;
  }
}

function handleLeave() {
  stopPolling();
  // Optional: send a "left" system message
  sb(ROOM_TABLE, {
    method: 'POST',
    body: JSON.stringify({
      user_id: 'system',
      user_name: 'System',
      content: state.userName + ' left the chat',
      is_system: true,
    }),
  }).catch(() => {});

  localStorage.removeItem('chat_user_id');
  localStorage.removeItem('chat_user_name');
  state.userId = null;
  state.userName = null;
  state.messages = [];
  state.lastMessageId = 0;
  els.messages.innerHTML = '<div class="empty">Loading messages...</div>';
  showNamePrompt();
}

async function handleSend(e) {
  e.preventDefault();
  const content = els.chatInput.value.trim();
  if (!content || !state.userId) return;

  els.sendBtn.disabled = true;
  els.chatInput.value = '';
  autoResize();

  try {
    await sb(ROOM_TABLE, {
      method: 'POST',
      body: JSON.stringify({
        user_id: state.userId,
        user_name: state.userName,
        content: content,
        is_system: false,
      }),
    });
    await loadMessages();
  } catch (err) {
    alert('Failed to send: ' + err.message);
    els.chatInput.value = content;
  } finally {
    els.sendBtn.disabled = false;
    els.chatInput.focus();
  }
}

async function loadMessages() {
  try {
    // Get last 100 messages, ordered oldest first
    const data = await sb(ROOM_TABLE + '?order=created_at.asc&limit=100');
    const newMessages = data || [];

    // Only re-render if there are new messages
    const latestId = newMessages.length > 0 ? newMessages[newMessages.length - 1].id : 0;
    if (latestId !== state.lastMessageId || state.messages.length !== newMessages.length) {
      state.messages = newMessages;
      state.lastMessageId = latestId;
      renderMessages();
    }
  } catch (err) {
    console.error('Load messages failed:', err);
  }
}

function renderMessages() {
  if (state.messages.length === 0) {
    els.messages.innerHTML = '<div class="empty">No messages yet. Say hi!</div>';
    return;
  }

  els.messages.innerHTML = state.messages.map(msg => {
    const isSystem = msg.is_system || msg.user_id === 'system';
    const isMine = !isSystem && msg.user_id === state.userId;
    const cls = isSystem ? 'system' : (isMine ? 'mine' : 'other');
    const time = formatTime(msg.created_at);

    if (isSystem) {
      return '<div class="msg system"><div class="msg-bubble">' + escapeHtml(msg.content) + '</div></div>';
    }

    return (
      '<div class="msg ' + cls + '">' +
        (isMine ? '' : '<div class="msg-name">' + escapeHtml(msg.user_name) + '</div>') +
        '<div class="msg-bubble">' + escapeHtml(msg.content) + '</div>' +
        '<div class="msg-time">' + time + '</div>' +
      '</div>'
    );
  }).join('');

  requestAnimationFrame(() => {
    els.messages.scrollTop = els.messages.scrollHeight;
  });
}

function startPolling() {
  stopPolling();
  state.pollTimer = setInterval(loadMessages, 2000);
}

function stopPolling() {
  if (state.pollTimer) {
    clearInterval(state.pollTimer);
    state.pollTimer = null;
  }
}

function autoResize() {
  els.chatInput.style.height = 'auto';
  els.chatInput.style.height = Math.min(els.chatInput.scrollHeight, 100) + 'px';
}

function formatTime(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = String(text);
  return div.innerHTML;
}

// Cleanup on tab close
window.addEventListener('beforeunload', stopPolling);

init();
</script>
</body>
</html>
