<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Solara Admin Dashboard" />
  <title>Solara Admin</title>
  <link rel="stylesheet" href="admin.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <!-- ===== LOGIN SCREEN ===== -->
  <div class="admin-login" id="adminLogin">
    <div class="admin-login-card">
      <div class="admin-login-logo">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <h1 class="admin-login-title">Solara Admin</h1>
      <p class="admin-login-subtitle">Access the support dashboard</p>
      <form class="admin-login-form" id="adminLoginForm">
        <input
          type="password"
          id="adminPassword"
          class="admin-login-input"
          placeholder="Admin password"
          autocomplete="current-password"
          required
        />
        <button type="submit" class="admin-login-btn" id="adminLoginBtn">
          <span>Sign In</span>
        </button>
        <div class="admin-login-error" id="adminLoginError"></div>
      </form>
      <a href="/" class="admin-back-link">Back to Solara</a>
    </div>
  </div>

  <!-- ===== DASHBOARD ===== -->
  <div class="admin-app" id="adminApp" style="display: none;">
    <!-- Sidebar: User list -->
    <aside class="admin-sidebar">
      <div class="admin-sidebar-header">
        <div class="admin-brand">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
            <path d="M2 17l10 5 10-5"/>
            <path d="M2 12l10 5 10-5"/>
          </svg>
          <span>Admin</span>
        </div>
        <button class="admin-logout-btn" id="adminLogoutBtn" title="Sign out">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>

      <div class="admin-search-wrapper">
        <input type="text" id="userSearch" class="admin-search" placeholder="Search users..." />
      </div>

      <div class="admin-users-list" id="usersList">
        <div class="admin-empty">Loading users...</div>
      </div>

      <div class="admin-sidebar-footer">
        <a href="/" class="admin-back-link">Back to Solara</a>
      </div>
    </aside>

    <!-- Main: Chat with selected user -->
    <main class="admin-main">
      <div class="admin-empty-state" id="emptyState">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
        </svg>
        <p>Select a user to start chatting</p>
      </div>

      <div class="admin-chat" id="adminChat" style="display: none;">
        <header class="admin-chat-header">
          <div class="admin-chat-header-info">
            <div class="admin-chat-avatar" id="chatAvatar">?</div>
            <div>
              <div class="admin-chat-name" id="chatUserName">User</div>
              <div class="admin-chat-status" id="chatUserStatus">Active recently</div>
            </div>
          </div>
        </header>

        <div class="admin-chat-messages" id="chatMessages"></div>

        <form class="admin-chat-form" id="chatForm">
          <textarea
            id="chatInput"
            class="admin-chat-input"
            placeholder="Type a reply..."
            rows="1"
            autocomplete="off"
          ></textarea>
          <button type="submit" class="admin-send-btn" id="adminSendBtn" aria-label="Send">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </form>
      </div>
    </main>
  </div>

  <script src="admin.js"></script>
</body>
</html>
